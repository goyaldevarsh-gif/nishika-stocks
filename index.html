<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nishika Stock</title><meta name="theme-color" content="#B01E5B">
<link rel="icon" href="icons/icon-192.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Nishika Stock">
<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--mag:#B01E5B;--mag2:#8E1548;--teal:#0D9488;--peach:#FFE7D6;--mus:#F6C64F;--lav:#E8DBFF;--mint:#DFF7E9;--ink:#1F1720;--mut:#6B5C66;--line:#EEDFE3;--bg:#FFF8F6;--red:#C62828;--green:#15803D;--amber:#B45309}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--mag)}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 4px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#hdr{position:fixed;top:0;left:0;right:0;z-index:20;background:linear-gradient(135deg,var(--mag),var(--mag2));color:#fff;padding-top:env(safe-area-inset-top)}
#hdr .in{max-width:760px;margin:0 auto;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px}
#hdr .t{flex:1;font-size:18px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .ib{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
#hdr .ib:active{background:rgba(255,255,255,.18)}
#app{max-width:760px;margin:0 auto;padding:calc(66px + env(safe-area-inset-top)) 14px 110px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:760px;margin:0 auto;display:flex}
#nav button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:#8a7a84}
#nav button.on{color:var(--mag)}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;background:var(--mag);color:#fff;border-radius:18px;padding:13px 18px;font-weight:700;display:flex;gap:6px;align-items:center;box-shadow:0 8px 20px rgba(176,30,91,.35)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(80,20,50,.05)}
.h1{font-size:22px;font-weight:800;margin:4px 0 0}.sub{color:var(--mut);font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}.sec h3{margin:0;font-size:17px;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:16px;padding:12px 14px}.stat .l{font-size:12.5px;font-weight:600;color:#4a3b45;display:flex;align-items:center;gap:6px}.stat .v{font-size:22px;font-weight:800;margin-top:6px}.stat .s{font-size:11.5px;color:#5c4d57;margin-top:2px}
.qa{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa .c{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
.qa small{font-weight:500;color:var(--mut);font-size:10.5px;line-height:1.2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;color:#4a3b45}
.chip.on{background:var(--mag);border-color:var(--mag);color:#fff}
.search{position:relative}.search input{padding-left:40px;background:#fff}.search svg{position:absolute;left:12px;top:11px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.row:active{background:#fff3f7}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.grow{flex:1;min-width:0}.grow b{font-weight:700}.grow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--lav);color:#4b2a8a}
.tag.loc{background:var(--mint);color:#0b5c3e}.tag.red{background:#FDE4E4;color:var(--red)}.tag.amb{background:#FFF0CC;color:var(--amber)}.tag.grn{background:#DDF6E6;color:var(--green)}
.rt{text-align:right;flex:none}.pill{display:inline-block;background:#FDE3EE;color:var(--mag);font-weight:800;padding:4px 10px;border-radius:99px;font-size:13px}
.ok{color:var(--green)}.low{color:var(--amber)}.out{color:var(--red)}.bad{color:var(--red)}.good{color:var(--green)}.mut{color:var(--mut)}
.btn{background:var(--mag);color:#fff;font-weight:700;padding:12px 16px;border-radius:14px;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:14px}.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn.ghost{background:#fff;color:var(--mag);border:1.5px solid var(--mag)}.btn.teal{background:var(--teal)}.btn.red{background:var(--red)}.btn.gray{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1;min-width:120px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:700;display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on{background:var(--mag);border-color:var(--mag);color:#fff}
.sel{width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;display:flex;justify-content:space-between;align-items:center}
.line{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0;background:#fff}
.line .l1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.line .l2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.line .amt{font-weight:800;padding:0 0 11px;min-width:70px;text-align:right}
.warn{font-size:12px;color:var(--amber);font-weight:600;margin-top:4px}
.x{color:var(--red);padding:4px}
.tl{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px}.tl.big{background:#FDE3EE;border-radius:12px;padding:12px;font-size:19px;font-weight:800;margin-top:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(30,10,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.full{height:92vh}.sheet .sh-h{font-size:18px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sh-f{position:sticky;bottom:-16px;background:#fff;padding:10px 0 0;display:flex;gap:8px}.sh-f .btn{flex:1}
.prow{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin:7px 0}.prow.added{background:#FFF3F8;border-color:var(--mag)}.prow input.pq{width:78px;padding:8px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1F1720;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;font-size:14px;max-width:90%;text-align:center}
.banner{background:#FFF0CC;border:1px solid #F0D58A;border-radius:14px;padding:10px 12px;font-size:13.5px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.rep{width:100%;border-collapse:collapse;font-size:13px}.rep th{text-align:left;background:#FDE3EE;padding:8px 6px;font-size:12px;position:sticky;top:0}.rep td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}.rep .r{text-align:right}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.bill{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.bill h2{margin:0;color:var(--mag);font-size:22px}
.bill table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}.bill th{text-align:left;border-bottom:2px solid var(--ink);padding:6px 4px;font-size:12px}.bill td{padding:6px 4px;border-bottom:1px solid var(--line)}.bill .r{text-align:right}
.big-n{font-size:34px;font-weight:800}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
@media print{#hdr,#nav,.fab,.noprint,#toast{display:none!important}#app{padding:0;max-width:none}.bill{border:0;padding:0}body{background:#fff}}
</style></head><body>
<div id="hdr"></div><div id="app"></div><div id="nav"><div class="in"></div></div>
<script>
'use strict';
/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>dstr(new Date());
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(r2(n)).toLocaleString('en-IN',{maximumFractionDigits:2});
const qf=n=>r2(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fdate=s=>{if(!s)return'';const [y,m,d]=s.split('-');return +d+' '+MON[+m-1]+(y===today().slice(0,4)?'':' '+y)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const clone=o=>JSON.parse(JSON.stringify(o));
const phoneWA=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d};
function rangeOf(k){const t=today(),d=new Date();
 if(k==='today')return[t,t];
 if(k==='week')return[addDays(t,-6),t];
 if(k==='month')return[t.slice(0,8)+'01',t];
 if(k==='year'){const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1;return[y+'-04-01',t]}
 return['0000-01-01','9999-12-31']}
const RANGES=[['today','Aaj'],['week','7 Din'],['month','Mahina'],['year','FY'],['all','Sab'],['custom','Custom']];

const IC={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 2-1.5L21 7H6"/>',
chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',back:'<path d="M15 5l-7 7 7 7"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 5 5"/>',
truck:'<path d="M2 6h11v10H2zM13 9h5l3 3v4h-8"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',rupee:'<path d="M7 5h10M7 9h10M7 5c6 0 6 8 0 8h-.5L16 20"/>',
pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',ul:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',print:'<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z"/>',
bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
wa:'<path d="M4 20l1.3-4.2A8 8 0 1 1 8.4 18.8z"/>',chev:'<path d="M9 5l7 7-7 7"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',tag:'<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/>',book:'<path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/>',
alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>'};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${IC[n]||''}</svg>`;

/* ================= DATA ================= */
const DEF=()=>({v:1,settings:{shop:'Nishika Creation',owner:'',phone:'',address:'',gstin:'',gstOn:false,gstPct:5,billPrefix:'NS-',purPrefix:'PU-',lastBackup:'',
 cats:['Suits','Sarees','Kurtis','Dress Material','Lehengas','Dupattas','Other'],units:['Set','Piece','Bundle','Meter']},
 items:[],parties:[],sales:[],purchases:[],returns:[],payments:[],adjustments:[],expenses:[],seq:{sale:0,pur:0,ret:0}});
function normalize(d){d=d||{};const o=Object.assign(DEF(),d);o.settings=Object.assign(DEF().settings,d.settings||{});
 ['items','parties','sales','purchases','returns','payments','adjustments','expenses'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
 o.seq=Object.assign({sale:0,pur:0,ret:0},d.seq||{});return o}
let DB=DEF(),C=null,saveT=null;
const IDB={db:null,open(){return new Promise(res=>{try{const r=indexedDB.open('nishika-stock',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{if(!this.db)return res(null);try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!this.db)return res(false);try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false)}catch(e){res(false)}})}};
async function loadDB(){const ok=await IDB.open();let d=ok?await IDB.get('db'):null;
 if(!d){try{const s=localStorage.getItem('nishika-db');if(s)d=JSON.parse(s)}catch(e){}}
 DB=normalize(d);if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
function flush(){const ok=IDB.db;if(ok)IDB.set('db',DB);else{try{localStorage.setItem('nishika-db',JSON.stringify(DB))}catch(e){}}}
function save(){C=null;clearTimeout(saveT);saveT=setTimeout(flush,250)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT){clearTimeout(saveT);saveT=null;flush()}});

const itemById=id=>DB.items.find(i=>i.id===id);
const partyById=id=>DB.parties.find(p=>p.id===id);
const pname=id=>{const p=partyById(id);return p?p.name:''};

function calc(){if(C)return C;
 const stock={},bought={},sold={},soldAmt={},lastSold={};
 DB.items.forEach(i=>{stock[i.id]=num(i.open);bought[i.id]=0;sold[i.id]=0;soldAmt[i.id]=0});
 DB.purchases.forEach(p=>p.lines.forEach(l=>{if(l.itemId in stock){stock[l.itemId]+=l.qty;bought[l.itemId]+=l.qty}}));
 DB.sales.forEach(s=>s.lines.forEach(l=>{if(l.itemId in stock){stock[l.itemId]-=l.qty;sold[l.itemId]+=l.qty;soldAmt[l.itemId]+=l.qty*l.rate;if(!lastSold[l.itemId]||s.date>lastSold[l.itemId])lastSold[l.itemId]=s.date}}));
 DB.returns.forEach(r=>r.lines.forEach(l=>{if(!(l.itemId in stock))return;if(r.kind==='sale'){stock[l.itemId]+=l.qty;sold[l.itemId]-=l.qty;soldAmt[l.itemId]-=l.qty*l.rate}else{stock[l.itemId]-=l.qty;bought[l.itemId]-=l.qty}}));
 DB.adjustments.forEach(a=>{if(a.itemId in stock)stock[a.itemId]+=a.qty});
 const bal={};DB.parties.forEach(p=>bal[p.id]=num(p.openBal));
 DB.sales.forEach(s=>{if(s.partyId in bal)bal[s.partyId]+=s.total-s.paid});
 DB.purchases.forEach(p=>{if(p.partyId in bal)bal[p.partyId]-=p.total-p.paid});
 DB.returns.forEach(r=>{if(r.partyId in bal)bal[r.partyId]+=r.kind==='sale'?-r.total:r.total});
 DB.payments.forEach(p=>{if(p.partyId in bal)bal[p.partyId]+=p.dir==='in'?-p.amt:p.amt});
 let value=0,pcs=0,retailVal=0,recv=0,pay=0,out=0,lowN=0;
 DB.items.forEach(i=>{const s=stock[i.id];if(s>0){value+=s*num(i.pRate);retailVal+=s*num(i.wRate);pcs+=s}if(s<=0)out++;else if(i.low>0&&s<=i.low)lowN++});
 DB.parties.forEach(p=>{const b=bal[p.id];if(b>0.009)recv+=b;else if(b<-0.009)pay-=b});
 return C={stock,bought,sold,soldAmt,lastSold,bal,value,pcs,retailVal,recv,pay,out,lowN}}
const stockOf=id=>calc().stock[id]||0;
const isLow=i=>{const s=stockOf(i.id);return s>0&&i.low>0&&s<=i.low};
const stClass=i=>{const s=stockOf(i.id);return s<=0?'out':isLow(i)?'low':'ok'};

function ledger(pid){const p=partyById(pid);const e=[];
 if(p&&num(p.openBal)!==0)e.push({date:'',t:0,type:'open',label:'Opening balance',delta:num(p.openBal)});
 DB.sales.filter(s=>s.partyId===pid).forEach(s=>{e.push({date:s.date,t:s.t||0,type:'sale',id:s.id,label:'Sale '+s.no,delta:s.total});if(s.paid>0)e.push({date:s.date,t:(s.t||0)+.1,type:'paid',id:s.id,label:'Paid at billing '+s.no,delta:-s.paid})});
 DB.purchases.filter(s=>s.partyId===pid).forEach(s=>{e.push({date:s.date,t:s.t||0,type:'purchase',id:s.id,label:'Purchase '+s.no,delta:-s.total});if(s.paid>0)e.push({date:s.date,t:(s.t||0)+.1,type:'paid',id:s.id,label:'Paid at purchase '+s.no,delta:s.paid})});
 DB.returns.filter(s=>s.partyId===pid).forEach(r=>e.push({date:r.date,t:r.t||0,type:'return',id:r.id,label:(r.kind==='sale'?'Sale return ':'Purchase return ')+r.no,delta:r.kind==='sale'?-r.total:r.total}));

 bg.addEventListener('mousedown',e=>{if(e.target===bg)closeSheet()});document.body.appendChild(bg);SHEETS.push({bg,onClose:o.onClose});return bg}

function parseCSV(t){const rows=[];let r=[],c='',q=false;t=t.replace(/^﻿/,'');
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}
const toCSV=rows=>'﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');

 try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
